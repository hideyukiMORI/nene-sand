name: CI
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
permissions:
  contents: read
jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev pkg-config python3-lldb-13 unzip curl ca-certificates
      - name: swiftly
        run: |
          curl -fsSL https://swiftlang.github.io/swiftly/swiftly-install.sh -o /tmp/swiftly-install.sh
          bash /tmp/swiftly-install.sh --disable-confirmation --no-modify-profile
          echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"
          {
            echo "SWIFTLY_BIN_DIR=$HOME/.local/share/swiftly/bin"
            echo "SWIFTLY_HOME_DIR=$HOME/.local/share/swiftly"
            echo "SWIFTLY_TOOLCHAINS_DIR=$HOME/.local/share/swiftly/toolchains"
          } >> "$GITHUB_ENV"
      - name: toolchain
        run: swiftly install --use --assume-yes "$(tr -d '[:space:]' < .swift-version)"
      - name: gate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: make check
